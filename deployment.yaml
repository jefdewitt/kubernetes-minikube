apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-poc
  labels:
    app: hello-poc-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-poc-app
  template:
    metadata:
      labels:
        app: hello-poc-app
    spec:
      containers:
      - name: agnhost
        image: registry.k8s.io/e2e-test-images/agnhost:2.39
        args:
        - "netexec"
        - "--http-port=8080"
        ports:
        - containerPort: 8080
